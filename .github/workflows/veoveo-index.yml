name: Refresh VeoVeo catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veoveo-index.yml'
      - 'tools/refresh-veoveo-index.py'
      - 'tools/build-veoveo-index.py'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veoveo-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, validate and build metadata
        run: python tests/veoveo-refresh-test.py && python tools/refresh-veoveo-index.py
      - name: Publish changed catalog
        run: |
          if [ -z "$(git status --porcelain -- data/veoveo)" ]; then
            echo "Catalog has not changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/veoveo
          git commit -m 'Refresh VeoVeo catalog metadata'
          git push origin HEAD:main
